<section class="booking-page">
  <div class="back-section">
    <a [routerLink]="['/services', serviceId]" class="back-btn">
      ← Back to Service Details
    </a>
  </div>

  <div class="booking-card">

    <div class="booking-header">
      <h1>Book a Service</h1>
      <p>Fill in your details and our team will contact you shortly.</p>
    </div>

   <form class="booking-form" (ngSubmit)="bookService()">

  <div class="form-grid">

    <!-- FULL NAME -->
    <div class="form-group">
      <label>
        Full Name
        <span class="required-star">*</span>
      </label>

      <input
        type="text"
        placeholder="Enter your name"
        [(ngModel)]="booking.customerName"
        name="customerName"
        required>
    </div>


    <!-- MOBILE NUMBER -->
    <div class="form-group">
      <label>
        Mobile Number
        <span class="required-star">*</span>
      </label>

      <input
        type="tel"
        placeholder="Enter 10-digit mobile number"
        [(ngModel)]="booking.phone"
        name="phone"
        maxlength="10"
        minlength="10"
        pattern="[0-9]{10}"
        inputmode="numeric"
        required
        (input)="booking.phone = booking.phone.replace(/[^0-9]/g, '').slice(0, 10)">
    </div>


    <!-- EMAIL -->
    <div class="form-group">
      <label>
        Email
        <span class="optional-text">(Optional)</span>
      </label>

      <input
        type="email"
        placeholder="Enter email"
        [(ngModel)]="booking.email"
        name="email">
    </div>


    <!-- SERVICE TYPE -->
    <div class="form-group">
      <label>
        Service Type
        <span class="required-star">*</span>
      </label>

      <input
        type="text"
        [(ngModel)]="booking.serviceName"
        name="serviceName"
        readonly
        required>
    </div>


    <!-- PREFERRED DATE -->
    <div class="form-group">
      <label>
        Preferred Date
        <span class="required-star">*</span>
      </label>

      <input
        type="date"
        [(ngModel)]="booking.bookingDate"
        name="bookingDate"
        required>
    </div>


    <!-- PREFERRED TIME -->
    <div class="form-group">
      <label>
        Preferred Time
        <span class="required-star">*</span>
      </label>

      <input
        type="time"
        [(ngModel)]="booking.bookingTime"
        name="bookingTime"
        required>
    </div>

  </div>


  <!-- ADDRESS -->
  <div class="form-group">

    <label>
      Address
      <span class="required-star">*</span>
    </label>

    <textarea
      rows="3"
      placeholder="Enter your address"
      [(ngModel)]="booking.address"
      name="address"
      required>
    </textarea>

  </div>


  <!-- PROBLEM DESCRIPTION -->
  <div class="form-group">

    <label>
      Problem Description
      <span class="required-star">*</span>
    </label>

    <textarea
      rows="5"
      placeholder="Describe your issue"
      [(ngModel)]="booking.issueDescription"
      name="issueDescription"
      required>
    </textarea>

  </div>


  <button
    type="submit"
    class="submit-btn">
    Book Service
  </button>

</form>

  </div>
</section>
