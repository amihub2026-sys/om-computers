<header class="header">

  <div class="logo">
    <h2>OM Computers</h2>
  </div>

  <nav [class.mobile-open]="mobileMenuOpen">

    <a
      routerLink="/"
      (click)="mobileMenuOpen=false"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: true }">
      Home
    </a>

    <a
      routerLink="/products"
      (click)="mobileMenuOpen=false"
      routerLinkActive="active-link">
      Products
    </a>

    <a
      routerLink="/services"
      (click)="mobileMenuOpen=false"
      routerLinkActive="active-link">
      Services
    </a>

    <a
      routerLink="/about"
      (click)="mobileMenuOpen=false"
      routerLinkActive="active-link">
      About
    </a>

    <a
      routerLink="/contact"
      (click)="mobileMenuOpen=false"
      routerLinkActive="active-link">
      Contact
    </a>

  </nav>

  <div class="header-right">

    <a routerLink="/cart" class="cart-btn">
      🛒

      <span
        class="cart-badge"
        *ngIf="cartCount > 0">
        {{ cartCount }}
      </span>

    </a>

  </div>

  <button
    class="menu-toggle"
    type="button"
    (click)="mobileMenuOpen = !mobileMenuOpen">
    ☰
  </button>

</header>
